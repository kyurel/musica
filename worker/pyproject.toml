[project]
name = "musica-worker"
version = "0.1.0"
description = "Musica analysis worker: claims jobs from the shared queue and analyses audio on this Mac."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "mutagen>=1.47",
  "pyloudnorm>=0.1.1",
  "supabase>=2.10",
  "httpx>=0.27",
  "keyring>=25",
]

[project.scripts]
musica-worker = "musica_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musica_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
